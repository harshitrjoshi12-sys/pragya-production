name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone Webview Template & Inject Pragya App
        run: |
          git clone --depth 1 https://github.com/swayangjit/Webview-App-Template.git android-project
          mkdir -p android-project/app/src/main/assets
          cp index.html android-project/app/src/main/assets/index.html
          cd android-project
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pragya-Production-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
