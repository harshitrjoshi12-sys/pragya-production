name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Web Directory & Wrapper
        run: |
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/values
          cp index.html android-app/app/src/main/assets/

      - name: Build Webview Android APK
        uses: ammarahm-ed/android-builder@v1.0.3
        with:
          project_dir: '.'
          
      - name: Fallback Direct Fast Build
        if: failure()
        run: |
          npm install -g @bubblewrap/cli
          yes | bubblewrap init --manifest="https://raw.githubusercontent.com/dummy/dummy/main/manifest.json" || true

      - name: Build Standalone APK
        run: |
          git clone https://github.com/hiteshsahu/Webview-App-Template.git app-template
          cp index.html app-template/app/src/main/assets/index.html
          cd app-template
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Pragya Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Pragya-Production-APK
          path: app-template/app/build/outputs/apk/debug/app-debug.apk
